# =========================================================
# Crypto Exchange DE Pipeline - Docker Compose
# =========================================================

services:

  # ---------------------------------------------------------
  # 1️⃣ PostgreSQL — база данных проекта
  # ---------------------------------------------------------
  postgres-project:
    image: postgres:15
    container_name: de_postgres_project
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: crypto_dw
    ports:
      - "5433:5432"
    volumes:
      # Автоматическое выполнение SQL-скрипта при первом запуске
      - ./scripts/init_crypto.sql:/docker-entrypoint-initdb.d/init_crypto.sql
      # Сохранение данных между перезапусками
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crypto_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------
  # 2️⃣ Airflow Webserver — веб-интерфейс
  # ---------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.7.1-python3.11
    container_name: de_airflow_webserver
    depends_on:
      postgres-project:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret@postgres-project/crypto_dw
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_secret_key_for_dev_only
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=UTC
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    # 🔑 АВТОМАТИЧЕСКОЕ СОЗДАНИЕ ПАПОК + ИНИЦИАЛИЗАЦИЯ + ЗАПУСК
    command: >
      bash -c "
        mkdir -p /opt/airflow/data/bronze &&
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true &&
        airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------
  # 3️⃣ Airflow Scheduler — планировщик задач
  # ---------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.11
    container_name: de_airflow_scheduler
    depends_on:
      postgres-project:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret@postgres-project/crypto_dw
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    # 🔑 АВТОМАТИЧЕСКОЕ СОЗДАНИЕ ПАПОК + ЗАПУСК SCHEDULER
    command: >
      bash -c "
        mkdir -p /opt/airflow/data/bronze &&
        airflow scheduler"

# =========================================================
# ТОМА (постоянное хранилище данных)
# =========================================================
volumes:
  postgres_data: