services:
  postgres-project:
    image: postgres:15
    container_name: de_postgres_project
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: crypto_dw
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/init_crypto.sql:/docker-entrypoint-initdb.d/init_crypto.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crypto_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-webserver:
    image: apache/airflow:2.7.1-python3.11
    container_name: de_airflow_webserver
    depends_on:
      postgres-project:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret@postgres-project/crypto_dw
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_secret_key_for_dev_only
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=UTC
      # 🔑 ИСПРАВЛЕНО: полный путь к модулю базовой аутентификации
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        airflow db migrate && \
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com 2>/dev/null || true && \
        airflow webserver
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.11
    container_name: de_airflow_scheduler
    depends_on:
      postgres-project:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret@postgres-project/crypto_dw
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command: airflow scheduler
    restart: unless-stopped

volumes:
  postgres_data: